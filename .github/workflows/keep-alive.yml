name: Keep Supabase awake

# Supabase pauses Free Plan projects that go roughly seven days without user
# database activity. Twice a week leaves a three-to-four day gap, which is
# margin for GitHub's scheduler running late — cron here is best effort, not a
# guarantee. The first scheduled run fired almost five hours after its slot.
#
# What it does: an anonymous SELECT against an RLS-protected table. The policy
# returns an empty array rather than rows, but the query still executes against
# Postgres, which is what Supabase measures. A bare HTTP ping to the auth
# service does not count, which is what this used to do before the schema
# existed.
#
# The key goes on `apikey` only. Publishable keys (sb_publishable_...) are not
# JWTs, so sending one as `Authorization: Bearer` makes the gateway try to parse
# it as a JWT and reject the request with 401.

on:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
    - cron: "0 6 * * 4" # Thursday 06:00 UTC
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    name: Ping Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Send an authenticated request
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL or SUPABASE_ANON_KEY is not set in repository secrets."
            exit 1
          fi

          # Strip any trailing slash so the path does not end up doubled.
          base="${SUPABASE_URL%/}"

          # An empty array is the expected body: RLS hides every row from an
          # anonymous caller. The point is that the query ran at all.
          status=$(curl \
            --silent --show-error \
            --max-time 30 \
            --retry 2 --retry-delay 5 \
            --output response.json \
            --write-out '%{http_code}' \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Cache-Control: no-cache" \
            "$base/rest/v1/days?select=id&limit=1")

          echo "Supabase responded with HTTP $status"
          echo "--- response body ---"
          head --bytes=400 response.json || true
          echo ""
          echo "--- end of response body ---"

          if [ "$status" != "200" ]; then
            echo "Expected HTTP 200. A 401 means the key is wrong or was sent"
            echo "on the wrong header; a 404 means the URL is wrong; a 5xx may"
            echo "mean the project is paused and needs restoring. A 404 with"
            echo "PGRST205 means the days table is gone."
            exit 1
          fi
